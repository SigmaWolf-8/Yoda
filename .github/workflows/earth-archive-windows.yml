name: Earth archive Windows installer

# Independent of the Salvi/Rust build. No environment, secrets or real datasets.
on:
  pull_request:
    paths:
      - 'scripts/earth_archive/**'
      - '.github/workflows/earth-archive-windows.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/earth_archive/**'
      - '.github/workflows/earth-archive-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows PowerShell 5.1 installer
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Invoke the real .ps1 from cmd. A custom powershell.exe shell receives an
      # extensionless Actions temporary file, which Windows PowerShell rejects.
      # The built-in powershell shell adds -ExecutionPolicy Bypass; avoid it.
      - name: Exercise isolated installer and generated runner
        shell: cmd
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -File .\scripts\earth_archive\tests\windows-installer.ps1
          exit /b %ERRORLEVEL%
