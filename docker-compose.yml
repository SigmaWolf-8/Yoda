# YODA — Docker Compose
#
# Two shapes, selected by profile:
#
#   Database only (local development — backend runs natively via `cargo run`
#   or `cargo tauri dev`, so there is no image to build):
#     docker compose --profile db up -d
#
#   Full stack (backend + database in containers):
#     cp .env.example .env  # Edit with real values
#     docker compose --profile full up -d
#     docker compose logs -f yoda
#
# `postgres` carries no profile, so it starts under any profile — and a bare
# `docker compose up -d` brings up just the database.
#
# For development with self-hosted inference engines, add llama-server
# services or point the Settings page at your local instances.
#
# See docker-compose.local.yml for the laptop-friendly database override.

services:
  yoda:
    # Profiled: local development runs the backend on the host, and building
    # this image on every `up` is a multi-minute Rust compile nobody wants.
    profiles: ["full"]
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgres://yoda:yoda_secret@postgres:5432/yoda"
      BIND_ADDR: "0.0.0.0"
      BIND_PORT: "3000"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}"
      RUST_LOG: "info"
      AGENTS_COMPILED_PATH: "./agents/compiled"
      MODEL_LINEAGES_PATH: "./model_lineages.json"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: yoda
      POSTGRES_PASSWORD: yoda_secret
      POSTGRES_DB: yoda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoda -d yoda"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
