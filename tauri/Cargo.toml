[package]
name = "yoda-desktop"
version = "0.1.0"
edition = "2021"
description = "YODA desktop shell — Tauri window hosting the React UI with the Axum API as a sidecar"
authors = ["Capomastro Holdings Ltd. <RSalvi@Salvigroup.com>"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/SigmaWolf-8/Yoda"
rust-version = "1.77.2"

# Standalone workspace — deliberate.
#
# The desktop shell pulls in the platform GUI toolchain (webkit2gtk / WebView2 /
# WKWebView). Every server-side build — Replit, Docker, CI — would have to
# resolve and link those crates if this package were a member of the root
# workspace, even when only `yoda-api` is being built. Keeping it as its own
# workspace means `cargo build` at the repo root never sees Tauri at all.
[workspace]

[lib]
# The `_lib` suffix avoids a name collision with the binary on Windows.
name = "yoda_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Not referenced directly — `tauri::generate_context!()` expands to code that
# names both crates, so they have to be in scope.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
