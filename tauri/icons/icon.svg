<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- YODA desktop mark — Capomastro Holdings Ltd.
       Torus gate: concentric rings on the warm-dark surface, brand blue. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6FB4F0"/>
      <stop offset="55%"  stop-color="#3D9AE8"/>
      <stop offset="100%" stop-color="#1C6FB8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%"   stop-color="#3D9AE8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3D9AE8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="#0B0908"/>
  <rect x="8" y="8" width="1008" height="1008" rx="218" fill="none" stroke="#2A2320" stroke-width="16"/>
  <circle cx="512" cy="512" r="380" fill="url(#glow)"/>

  <!-- outer torus -->
  <circle cx="512" cy="512" r="318" fill="none" stroke="url(#ring)" stroke-width="52"/>
  <!-- inner torus -->
  <circle cx="512" cy="512" r="188" fill="none" stroke="#EBE4D6" stroke-width="34" stroke-opacity="0.92"/>
  <!-- gate core -->
  <circle cx="512" cy="512" r="74" fill="url(#ring)"/>

  <!-- three cardinal notches: Alpha / Beta / Gamma -->
  <g fill="#0B0908">
    <rect x="472" y="150" width="80" height="150" rx="40"/>
    <rect x="472" y="724" width="80" height="150" rx="40" transform="rotate(120 512 512)"/>
    <rect x="472" y="724" width="80" height="150" rx="40" transform="rotate(240 512 512)"/>
  </g>
</svg>
